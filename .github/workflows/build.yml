name: Build container

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read dovecot and wormhole versions
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          wormhole="$(tr -d '[:space:]' < WORMHOLE_VERSION)"
          test -n "$version"
          test -n "$wormhole"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wormhole=$wormhole" >> "$GITHUB_OUTPUT"
          # Release tag: the upstream Dovecot version — epoch, dfsg suffix and
          # packaging revision stripped — paired with the plugin version,
          # because both determine what the image contains.
          upstream="$(sed -E 's/^[0-9]+://; s/[+-].*$//' <<<"$version")"
          echo "release=${upstream}-wormhole${wormhole}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/slim-it/dovecot-container
          tags: |
            type=raw,value=${{ steps.version.outputs.release }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            DOVECOT_VERSION=${{ steps.version.outputs.version }}
            WORMHOLE_VERSION=${{ steps.version.outputs.wormhole }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
